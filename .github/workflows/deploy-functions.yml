# Деплой Supabase Edge Functions при пуші в main (якщо змінились файли функцій)
# або вручну (Actions → Deploy Edge Functions → Run workflow).
#
# Потрібен один новий секрет репозиторію (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — Supabase Dashboard → Account (аватар) → Access Tokens → Generate.
# <ref> проєкту береться з уже наявного VITE_SUPABASE_URL (https://<ref>.supabase.co);
# за бажанням його можна задати явно секретом SUPABASE_PROJECT_REF.
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy discord-events
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Немає секрету SUPABASE_ACCESS_TOKEN (див. коментар у workflow)"; exit 1; }
          ref="$SUPABASE_PROJECT_REF"
          if [ -z "$ref" ]; then
            # https://<ref>.supabase.co → <ref>
            ref=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#^https?://([^./]+)\.supabase\.(co|in).*#\1#')
          fi
          test -n "$ref" && [ "$ref" != "$VITE_SUPABASE_URL" ] || { echo "::error::Не вдалося визначити ref проєкту: задай секрет SUPABASE_PROJECT_REF"; exit 1; }
          supabase functions deploy discord-events --no-verify-jwt --project-ref "$ref"
